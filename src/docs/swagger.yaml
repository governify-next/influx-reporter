openapi: 3.0.0
info:
    title: Influx Reporter
    version: 1.0.0
    description: Consumes State events from Kafka and writes projections to InfluxDB 3.
servers:
    - url: /
paths:
    /health:
        get:
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                    message:
                                        type: string
